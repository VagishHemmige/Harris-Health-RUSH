project:
  type: website
  output-dir: docs
  # Only the site's pages, so the root .md files are not rendered as pages
  # of their own; they are shown through the Project documents pages.
  render:
    - index.qmd
    - 404.qmd
    - quarto/**

author:
  - name: Vagish Hemmige
    orcid: 0009-0006-6346-1826

bibliography: references.bib

website:
  title: "RUSH: re-linkage to HIV care after emergency department testing"
  site-url: https://vagishhemmige.github.io/Harris-Health-RUSH
  repo-url: https://github.com/VagishHemmige/Harris-Health-RUSH
  repo-branch: main
  repo-actions: [edit, issue]
  page-navigation: true

  sidebar:
    style: docked
    # Every section starts open, including those inside Code
    collapse-level: 3
    search: true
    contents:
      - href: index.qmd
        text: Home
        icon: house

      - section: Background
        contents:
          - href: quarto/background.qmd
            text: Clinical background
            icon: book
          - href: quarto/methodological_background.qmd
            text: Methodological background
            icon: book

      - section: Study design and methods
        contents:
          - href: quarto/study_methods.qmd
            text: Study design and methods
            icon: diagram-3
          - href: quarto/differences.qmd
            text: Differences from the original code
            icon: diagram-3

      - section: Code
        contents:
          - section: Setup and helper functions
            contents:
              - href: quarto/setup.qmd
                text: Setup
                icon: laptop
              - href: quarto/functions.qmd
                text: Functions
                icon: laptop

          # One numbered page per definitive script, in the order main.R
          # sources them
          - section: Data processing and analysis
            contents:
              - href: quarto/01_import_data.qmd
                text: 1. Import data
                icon: laptop
              - href: quarto/02_build_long_data.qmd
                text: 2. Build long data
                icon: laptop
              - href: quarto/03_paired_comparisons.qmd
                text: 3. Paired comparisons
                icon: laptop
              - href: quarto/04_fit_rush_era_models.qmd
                text: 4. RUSH-era models
                icon: laptop
              - href: quarto/05_compare_eras.qmd
                text: 5. Comparison with the pre-RUSH era
                icon: laptop

          - section: Tables and figures
            contents:
              - href: quarto/tables.qmd
                text: Tables
                icon: laptop
              - href: quarto/teaching_figures.qmd
                text: Teaching figures
                icon: laptop

          - section: Original code
            contents:
              - href: quarto/original_stata.qmd
                text: Original Stata code (2015)
                icon: laptop

      - section: Results
        contents:
          - href: quarto/published_results.qmd
            text: Published results and the code behind them
            icon: clipboard-data
          - href: quarto/published_engagement.qmd
            text: Engagement in care (Table 2)
            icon: clipboard-data
          - href: quarto/published_retention.qmd
            text: Retention in care (Table 3)
            icon: clipboard-data
          - href: quarto/published_suppression.qmd
            text: Viral suppression (Table 4)
            icon: clipboard-data

      - section: Project documents
        contents:
          - href: quarto/analysis-plan.qmd
            text: Analysis plan
            icon: file-earmark-ruled
          - href: quarto/architecture.qmd
            text: Architecture
            icon: file-earmark-ruled
          - href: quarto/agents.qmd
            text: AGENTS.md
            icon: file-earmark-ruled
          - href: quarto/repository-blueprint.qmd
            text: Repository blueprint
            icon: file-earmark-ruled

      - href: quarto/about.qmd
        text: About
        icon: info-circle

# Each kind of page has one cue, used both in the sidebar (icon and colour
# set here and in styles.css) and on the page (a callout of the same colour):
#   background                book icon, blue
#   study design and methods  diagram-3 icon, orange
#   R code                    laptop icon and the 💻 Rcode callout, pink
#   results                   clipboard-data icon and the 📊 Results callout, green
#   project documents         ruled-page icon, grey
# Yellow, with the ⏳ Pending callout, marks provisional content.
custom-callout:
  Rcode:
    icon: true
    icon-symbol: "💻"
    color: "#d63384"
  Results:
    icon: true
    icon-symbol: "📊"
    color: "#198754"
  Pending:
    icon: true
    icon-symbol: "⏳"
    color: "#f0c400"

filters:
  # Yellow marks for provisional content, and their Pending callout
  # (AGENTS.md, "Quarto website"). It runs before custom-callout, which
  # turns the callout it adds into a styled box.
  - quarto/_pending.lua
  - custom-callout

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    code-fold: true
    code-tools: true
    page-layout: full
    code-summary: "Click to show/hide R Code"

# The site shows code; it never runs the analysis. Only the hidden
# read_chunk() imports, the Architecture page's reader of ARCHITECTURE.md
# and the original-code page's reader of the .do file set eval: true.
execute:
  eval: false
