# Runs the whole analysis on synthetic data on every pull request and push
# to main, or by hand from the Actions tab, and fails if R/main.R errors or
# a helper no longer gives the answer known from theory
# (tests/synthetic/run_pipeline.R). The runner has no study data: everything
# it reads is built by tests/synthetic/build_synthetic_data.R, and the log
# shows counts and checks on synthetic data only.

on:
  workflow_dispatch:
  push:
    branches: main
  pull_request:
    branches: main

name: Test pipeline on synthetic data

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # The packages R/setup.R attaches, plus writexl for the synthetic files.
      # Quarto is not installed: this job renders nothing.
      - name: Install the R packages the analysis uses
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          install-quarto: false
          packages: |
            any::tidyverse
            any::readxl
            any::writexl
            any::survival
            any::lme4

      - name: Run the analysis on synthetic data
        run: Rscript tests/synthetic/run_pipeline.R
