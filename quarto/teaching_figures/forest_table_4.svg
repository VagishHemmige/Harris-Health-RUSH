<title id="forest_table_4-title">Viral suppression: odds ratio for the visit within each category (Table 4)</title>
<desc id="forest_table_4-desc">Forest plot of the article's Table 4 on a log scale from 0.1 to 50; 1 means no change. Each row is a category's odds ratio with its 95% confidence interval. Sex Female: 2.47 (1.80–3.40); Sex Male: 2.68 (2.11–3.41); Race Black: 2.76 (2.18–3.49); Race Hispanic: 2.84 (1.80–4.48); Race White: 1.81 (1.12–2.92); Race Other: ∞*; Age group 16–24: 2.20 (0.76–6.33); Age group 25–34: 6.84 (3.83–12.3); Age group 35–44: 2.49 (1.77–3.49); Age group 45–54: 2.65 (1.90–3.69); Age group 55+: 1.06 (0.66–1.72); Year of visit 2009: 2.73 (1.87–3.98); Year of visit 2010: 2.47 (1.73–3.51); Year of visit 2011: 2.72 (1.86–3.99); Year of visit 2012: 2.52 (1.64–3.87); Years since diagnosis 1–5: 4.24 (2.83–6.36); Years since diagnosis 6–10: 3.00 (2.06–4.37); Years since diagnosis 11–15: 3.25 (2.13–4.96); Years since diagnosis 16–20: 1.03 (0.63–1.68); Years since diagnosis 21+: 1.15 (0.63–2.09); Total Total: 2.61 (2.15–3.16)</desc>
