<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" role="img" aria-labelledby="f1-title f1-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="f1-title">Paired outcomes: only the people whose outcome changed carry information</title>
<desc id="f1-desc">Invented example of 100 people measured before and after. A two-by-two table: 30 had the outcome both times, 45 never had it, 5 lost it and 20 gained it. The 25 people whose outcome changed are highlighted. The odds ratio is 20 divided by 5, 4.0. Of the 65 without the outcome before, 20 gained it (31%); of the 35 with it, 5 lost it (14%).</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16.0" y="26.0" font-size="15" fill="#1f1f1e" text-anchor="start" font-weight="600">Invented example: 100 people, before and after</text>
<text x="168.0" y="56.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">After: yes</text>
<text x="296.0" y="56.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">After: no</text>
<text x="92.0" y="115.0" font-size="13" fill="#52514e" text-anchor="end" font-weight="normal">Before: yes</text>
<text x="92.0" y="195.0" font-size="13" fill="#52514e" text-anchor="end" font-weight="normal">Before: no</text>
<rect x="106.0" y="72.0" width="124.0" height="76.0" rx="6" fill="#f4f3ef" stroke="none"/>
<text x="168.0" y="106.0" font-size="20" fill="#52514e" text-anchor="middle" font-weight="600">a = 30</text>
<text x="168.0" y="128.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">had it both times</text>
<rect x="234.0" y="72.0" width="124.0" height="76.0" rx="6" fill="#eb6834" stroke="none"/>
<text x="296.0" y="106.0" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="600">b = 5</text>
<text x="296.0" y="128.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="normal">lost it (worse)</text>
<rect x="106.0" y="152.0" width="124.0" height="76.0" rx="6" fill="#2a78d6" stroke="none"/>
<text x="168.0" y="186.0" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="600">c = 20</text>
<text x="168.0" y="208.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="normal">gained it (better)</text>
<rect x="234.0" y="152.0" width="124.0" height="76.0" rx="6" fill="#f4f3ef" stroke="none"/>
<text x="296.0" y="186.0" font-size="20" fill="#52514e" text-anchor="middle" font-weight="600">d = 45</text>
<text x="296.0" y="208.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">never had it</text>
<text x="384.0" y="74.0" font-size="13" fill="#1f1f1e" text-anchor="start" font-weight="600">Only b and c carry the change</text>
<rect x="384.0" y="88.0" width="140.0" height="18.0" rx="4" fill="#2a78d6" stroke="none"/>
<text x="530.0" y="102.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">c = 20 better</text>
<rect x="384.0" y="114.0" width="35.0" height="18.0" rx="4" fill="#eb6834" stroke="none"/>
<text x="425.0" y="128.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">b = 5 worse</text>
<text x="384.0" y="166.0" font-size="13" fill="#1f1f1e" text-anchor="start" font-weight="600">Odds ratio = c / b = 20 / 5 = 4.0</text>
<text x="384.0" y="188.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Conditional logistic regression gives</text>
<text x="384.0" y="204.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">the same odds ratio.</text>
<line x1="16.0" y1="258.0" x2="664.0" y2="258.0" stroke="#d9d8d3" stroke-width="1"/>
<text x="16.0" y="284.0" font-size="13" fill="#1f1f1e" text-anchor="start" font-weight="600">What a clinician asks, from the same table:</text>
<text x="16.0" y="308.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">Of the 65 without the outcome before, 20 gained it: 31%  (c / (c + d))</text>
<text x="16.0" y="330.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">Of the 35 with the outcome before, 5 lost it: 14%  (b / (a + b))</text>
</svg>