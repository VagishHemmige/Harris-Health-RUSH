<title id="forest_table_2-title">Engagement in care: odds ratio for the visit within each category (Table 2)</title>
<desc id="forest_table_2-desc">Forest plot of the article's Table 2 on a log scale from 0.1 to 50; 1 means no change. Each row is a category's odds ratio with its 95% confidence interval. Sex Female: 4.72 (3.30–6.77); Sex Male: 3.38 (2.69–4.24); Race Black: 4.41 (3.47–5.60); Race Hispanic: 2.88 (1.85–4.51); Race White: 2.18 (1.32–3.61); Race Other: 5.00 (0.58–42.8); Age group 16–24: 9.33 (2.84–30.7); Age group 25–34: 5.95 (3.70–9.55); Age group 35–44: 3.53 (2.52–4.96); Age group 45–54: 3.53 (2.52–4.96); Age group 55+: 1.87 (1.13–3.10); Year of visit 2009: 2.86 (2.02–4.05); Year of visit 2010: 3.41 (2.39–4.87); Year of visit 2011: 4.52 (2.98–6.86); Year of visit 2012: 5.04 (3.22–7.89); Years since diagnosis 1–5: 5.19 (3.55–7.57); Years since diagnosis 6–10: 3.77 (2.60–5.47); Years since diagnosis 11–15: 3.19 (2.20–4.64); Years since diagnosis 16–20: 2.65 (1.52–4.62); Years since diagnosis 21+: 3.00 (1.56–5.77); Total Total: 3.74 (3.09–4.53)</desc>
