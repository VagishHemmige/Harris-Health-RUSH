<title id="forest_table_3-title">Retention in care: odds ratio for the visit within each category (Table 3)</title>
<desc id="forest_table_3-desc">Forest plot of the article's Table 3 on a log scale from 0.1 to 50; 1 means no change. Each row is a category's odds ratio with its 95% confidence interval. Sex Female: 3.52 (2.52–4.92); Sex Male: 2.49 (2.03–3.06); Race Black: 3.18 (2.55–3.95); Race Hispanic: 2.36 (1.57–3.55); Race White: 1.74 (1.12–2.70); Race Other: 2.00 (0.18–22.1); Age group 16–24: 4.80 (1.83–12.6); Age group 25–34: 4.19 (2.73–6.43); Age group 35–44: 3.41 (2.46–4.74); Age group 45–54: 2.31 (1.71–3.11); Age group 55+: 1.19 (0.74–1.90); Year of visit 2009: 2.62 (1.92–3.60); Year of visit 2010: 2.76 (1.97–3.87); Year of visit 2011: 3.03 (2.08–4.41); Year of visit 2012: 2.66 (1.80–3.92); Years since diagnosis 1–5: 3.90 (2.76–5.52); Years since diagnosis 6–10: 2.81 (2.01–3.92); Years since diagnosis 11–15: 3.12 (2.12–4.59); Years since diagnosis 16–20: 1.47 (0.95–2.27); Years since diagnosis 21+: 1.69 (0.91–3.13); Total Total: 2.75 (2.31–3.28)</desc>
