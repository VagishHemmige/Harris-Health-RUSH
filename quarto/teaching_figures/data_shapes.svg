<line x1="430.0" y1="176.0" x2="618.0" y2="176.0" stroke="#d9d8d3" stroke-width="1"/>
<text x="16.0" y="206.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">The patient (id) is the stratum: each model compares P1 after with P1 before.</text>
<text x="16.0" y="226.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">A patient whose outcome is the same in both periods adds nothing to the estimate.</text>
<text x="16.0" y="252.0" font-size="11" fill="#7a7974" text-anchor="start" font-weight="normal">Invented values, for illustration only.</text>
</svg>