<text x="436.0" y="125.0" font-size="11" fill="#1f1f1e" text-anchor="start" font-weight="normal">P1</text>
<text x="468.0" y="125.0" font-size="11" fill="#1f1f1e" text-anchor="start" font-weight="normal">0</text>
<text x="508.0" y="125.0" font-size="11" fill="#1f1f1e" text-anchor="start" font-weight="normal">1</text>
<text x="560.0" y="125.0" font-size="11" fill="#1f1f1e" text-anchor="start" font-weight="normal">1</text>
<line x1="430.0" y1="132.0" x2="618.0" y2="132.0" stroke="#d9d8d3" stroke-width="1"/>
<text x="436.0" y="147.0" font-size="11" fill="#1f1f1e" text-anchor="start" font-weight="normal">P1</text>
<text x="468.0" y="147.0" font-size="11" fill="#1f1f1e" text-anchor="start" font-weight="normal">1</text>
<text x="508.0" y="147.0" font-size="11" fill="#1f1f1e" text-anchor="start" font-weight="normal">0</text>
<text x="560.0" y="147.0" font-size="11" fill="#1f1f1e" text-anchor="start" font-weight="normal">0</text>
<line x1="430.0" y1="154.0" x2="618.0" y2="154.0" stroke="#d9d8d3" stroke-width="1"/>
<text x="436.0" y="169.0" font-size="11" fill="#1f1f1e" text-anchor="start" font-weight="normal">P1</text>
<text x="468.0" y="169.0" font-size="11" fill="#1f1f1e" text-anchor="start" font-weight="normal">1</text>
<text x="508.0" y="169.0" font-size="11" fill="#1f1f1e" text-anchor="start" font-weight="normal">1</text>
