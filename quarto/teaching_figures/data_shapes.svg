<text x="436.0" y="81.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="600">id</text>
<text x="468.0" y="81.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="600">era</text>
<text x="508.0" y="81.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="600">period</text>
