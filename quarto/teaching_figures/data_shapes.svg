<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 266" width="680" height="266" role="img" aria-labelledby="f9-title f9-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="f9-title">From one row per patient to one row per patient and period</title>
<desc id="f9-desc">Three small tables for one invented patient, P1. Wide: one row with engagement before (0) and after (1). Long: two rows, one per period, with period 0 before and 1 after. Stacked eras: four rows when the patient also had a pre-RUSH visit, with era 0 for pre-RUSH and 1 for RUSH. The patient is the stratum in every model.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16.0" y="24.0" font-size="15" fill="#1f1f1e" text-anchor="start" font-weight="600">Invented patient P1: how the data change shape</text>
<text x="16.0" y="52.0" font-size="13" fill="#1f1f1e" text-anchor="start" font-weight="600">Wide (one row)</text>
<rect x="16.0" y="66.0" width="144.0" height="22.0" rx="3" fill="#f4f3ef" stroke="none"/>
<text x="22.0" y="81.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="600">id</text>
<text x="58.0" y="81.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="600">before</text>
<text x="116.0" y="81.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="600">after</text>
<text x="22.0" y="103.0" font-size="11" fill="#1f1f1e" text-anchor="start" font-weight="normal">P1</text>
<text x="58.0" y="103.0" font-size="11" fill="#1f1f1e" text-anchor="start" font-weight="normal">0</text>
<text x="116.0" y="103.0" font-size="11" fill="#1f1f1e" text-anchor="start" font-weight="normal">1</text>
<line x1="16.0" y1="110.0" x2="160.0" y2="110.0" stroke="#d9d8d3" stroke-width="1"/>
<text x="185.0" y="92.0" font-size="22" fill="#7a7974" text-anchor="start" font-weight="normal">→</text>
<text x="214.0" y="52.0" font-size="13" fill="#1f1f1e" text-anchor="start" font-weight="600">Long (two rows)</text>
<rect x="214.0" y="66.0" width="158.0" height="22.0" rx="3" fill="#f4f3ef" stroke="none"/>
<text x="220.0" y="81.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="600">id</text>
<text x="256.0" y="81.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="600">period</text>
<text x="312.0" y="81.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="600">engaged</text>
<text x="220.0" y="103.0" font-size="11" fill="#1f1f1e" text-anchor="start" font-weight="normal">P1</text>
<text x="256.0" y="103.0" font-size="11" fill="#1f1f1e" text-anchor="start" font-weight="normal">0</text>
<text x="312.0" y="103.0" font-size="11" fill="#1f1f1e" text-anchor="start" font-weight="normal">0</text>
<line x1="214.0" y1="110.0" x2="372.0" y2="110.0" stroke="#d9d8d3" stroke-width="1"/>
<text x="220.0" y="125.0" font-size="11" fill="#1f1f1e" text-anchor="start" font-weight="normal">P1</text>
<text x="256.0" y="125.0" font-size="11" fill="#1f1f1e" text-anchor="start" font-weight="normal">1</text>
<text x="312.0" y="125.0" font-size="11" fill="#1f1f1e" text-anchor="start" font-weight="normal">1</text>
<line x1="214.0" y1="132.0" x2="372.0" y2="132.0" stroke="#d9d8d3" stroke-width="1"/>
<text x="400.0" y="92.0" font-size="22" fill="#7a7974" text-anchor="start" font-weight="normal">→</text>
<text x="430.0" y="52.0" font-size="13" fill="#1f1f1e" text-anchor="start" font-weight="600">Both eras (four rows)</text>
